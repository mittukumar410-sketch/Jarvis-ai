
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI 2.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;
 background:#030b18;color:#00d9ff;
 font-family:Arial;text-align:center;
 min-height:100vh;
}
h1{letter-spacing:5px;margin-top:30px}
.circle{
 width:200px;height:200px;border-radius:50%;
 border:3px solid #00d9ff;
 box-shadow:0 0 30px #00bfff,inset 0 0 25px #007bff;
 margin:45px auto 25px;
 display:flex;align-items:center;justify-content:center;
 animation:pulse 2s infinite;
}
.circle span{font-size:65px}
@keyframes pulse{
 50%{box-shadow:0 0 50px #00d9ff}
}
#status{color:#8deaff}
#reply{color:white;min-height:55px;margin:20px auto}
input{
 width:95%;padding:15px;border-radius:20px;
 border:1px solid #00d9ff;background:#07182b;
 color:white;font-size:16px;
}
button{
 background:#00cfff;color:#00101b;border:0;
 border-radius:25px;padding:14px 22px;
 font-weight:bold;margin:8px;font-size:15px;
}
.notes{
 border:1px solid #007bff;border-radius:12px;
 padding:12px;margin-top:30px;color:white;
}
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT 2.0</p>

<div class="circle"><span>🤖</span></div>

<p id="status">SYSTEM ONLINE</p>
<div id="reply">Hello Sir! I am JARVIS.</div>

<input id="question" placeholder="Type your command...">

<br>
<button onclick="listen()">🎙️ SPEAK</button>
<button onclick="send()">SEND</button>

<div class="notes">
<h3>📝 MY NOTES</h3>
<div id="notesList">No notes saved.</div>
</div>

<script>
const statusText=document.getElementById("status");
const reply=document.getElementById("reply");
const question=document.getElementById("question");

function speak(text){
 const s=new SpeechSynthesisUtterance(text);
 s.lang=/[\u0900-\u097F]/.test(text)?"hi-IN":"en-IN";
 s.rate=1;
 speechSynthesis.cancel();
 speechSynthesis.speak(s);
}

function say(text){
 reply.innerText=text;
 speak(text);
}

function listen(){
 const SR=window.SpeechRecognition ||
          window.webkitSpeechRecognition;
 if(!SR){
  say("Please use Chrome browser for voice commands.");
  return;
 }
 const rec=new SR();
 rec.lang="hi-IN";
 rec.onstart=()=>statusText.innerText="LISTENING...";
 rec.onresult=e=>{
  question.value=e.results[0][0].transcript;
  send();
 };
 rec.onerror=()=>statusText.innerText="MIC ERROR";
 rec.onend=()=>statusText.innerText="SYSTEM ONLINE";
 rec.start();
}

function showNotes(){
 const notes=JSON.parse(localStorage.getItem("jarvisNotes")||"[]");
 document.getElementById("notesList").innerHTML=
 notes.length ? notes.map((n,i)=>
 (i+1)+". "+escapeHTML(n)).join("<br>"):"No notes saved.";
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function send(){
 const q=question.value.trim().toLowerCase();
 if(!q)return;

 if(q.includes("hello")||q.includes("नमस्ते")){
  say("Hello Sir! How can I help you?");
 }

 else if(q.includes("your name")||q.includes("नाम")){
  say("My name is Nisha. Your personal assistant.");
 }

 else if(q.includes("time")||q.includes("समय")){
  say("अभी समय है "+new Date().toLocaleTimeString("en-IN"));
 }

 else if(q.includes("date")||q.includes("तारीख")){
  say("आज की तारीख है "+new Date().toLocaleDateString("hi-IN"));
 }

else if(
 q.includes("youtube") ||
 q.includes("यूट्यूब") ||
 q.includes("यूटुब")
){
 say("Opening YouTube Sir");
 window.open("https://www.youtube.com","_blank");
}

 else if(
 q.includes("open google") ||
 q.includes("google") ||
 q.includes("गूगल")
){
 say("Opening Google Sir");
 window.open("https://www.google.com","_blank");
 }

 else if(q.includes("show notes")||q.includes("नोट दिखाओ")){
  showNotes();
  say("Here are your saved notes.");
 }

 else if(q.includes("clear notes")||q.includes("नोट मिटाओ")){
  localStorage.removeItem("jarvisNotes");
  showNotes();
  say("All notes cleared.");
 }

 else if(q.startsWith("note ")||q.startsWith("याद रखो ")){
  const note=q.startsWith("note ")?q.slice(5):q.slice(8);
  const notes=JSON.parse(localStorage.getItem("jarvisNotes")||"[]");
  notes.push(note);
  localStorage.setItem("jarvisNotes",JSON.stringify(notes));
  showNotes();
  say("Your note has been saved.");
 }

 else if(q.includes("remind me")||q.includes("याद दिलाना")){
  const match=q.match(/(\d+)\s*(minute|minutes|min|मिनट)/);
  if(match){
   const mins=Number(match[1]);
   if(mins>0 && mins<=1440){
    const task=q.replace(/remind me|याद दिलाना/,"")
      .replace(/\d+\s*(minute|minutes|min|मिनट)/,"").trim();
    say("Reminder set for "+mins+" minutes.");
    setTimeout(()=>{
     alert("JARVIS REMINDER: "+(task||"Your reminder"));
     speak("Sir, your reminder is due.");
    },mins*60000);
   }else say("Please choose between 1 and 1440 minutes.");
  }else say("Please say a reminder time in minutes.");
 }

 else if(q.includes("calculate")||q.includes("गणना")){
  const match=q.match(/(-?\d+(?:\.\d+)?)\s*(plus|add|जोड़|minus|subtract|घटाना|times|multiply|गुणा|divided by|divide|भाग)\s*(-?\d+(?:\.\d+)?)/);
  if(match){
   const a=Number(match[1]),b=Number(match[3]);
   const op=match[2];
   let result;
   if(["plus","add","जोड़"].includes(op))result=a+b;
   else if(["minus","subtract","घटाना"].includes(op))result=a-b;
   else if(["times","multiply","गुणा"].includes(op))result=a*b;
   else if(b!==0)result=a/b;
   else {say("Cannot divide by zero.");question.value="";return;}
   say("The answer is "+result);
  }else say("Try: Calculate 5 plus 3.");
 }

 else{
  say("Sorry Sir, I don't know this command yet.");
 }

 question.value="";
}

showNotes();
 window.addEventListener("load", function(){
  setTimeout(function(){
    say("Hello, मिट्ठू ji! निशा is ready to help you.");
  }, 1000);
});
</script>
</body>
</html>
